[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pn-ultra-audit"
version = "1.0.17"
description = "One read-only command to audit code, tests, docs, databases, servers, SEO, crypto, SaaS/fintech and audit-readiness - live in the terminal, delivered as a dashboard."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-only" }
keywords = ["audit", "security", "sast", "code-quality", "compliance", "soc2", "iso27001", "seo", "fintech", "web3", "devsecops"]
dependencies = []

[project.scripts]
pn-ultra-audit = "audit:main"

[tool.setuptools]
py-modules = ["audit"]
packages = ["engine"]

[tool.setuptools.package-data]
engine = ["locales/*.json"]

[tool.ruff]
line-length = 200
target-version = "py39"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E9", "F"]   # syntax errors + pyflakes (unused names, undefined names)

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
check_untyped_defs = false   # start lenient; tighten per package
