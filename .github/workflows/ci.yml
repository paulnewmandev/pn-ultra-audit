name: CI
on: { push: { branches: [main] }, pull_request: {} }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    strategy: { matrix: { python: ["3.9", "3.11", "3.12"] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m unittest -v
      - run: python audit.py examples/vulnerable-demo --out /tmp/out --color never --lang en --export /tmp/docs
      - run: python scripts/gen_docs.py && git diff --exit-code docs/RULES.md docs/CLI.md || echo "docs regenerated (commit them)"
