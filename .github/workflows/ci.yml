name: CI
on: { push: { branches: [main] }, pull_request: {} }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest (26.04) has no Python 3.9 build
    strategy:
      fail-fast: false
      matrix: { python: ["3.9", "3.11", "3.12", "3.13"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install ruff && ruff check .
      - run: python -m unittest -v
      - run: python audit.py examples/vulnerable-demo --out /tmp/out --color never --lang en --export /tmp/docs
      - run: python scripts/gen_docs.py && git diff --exit-code docs/RULES.md docs/CLI.md || echo "docs regenerated (commit them)"
